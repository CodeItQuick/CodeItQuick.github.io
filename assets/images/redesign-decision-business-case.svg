<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="40" y="56" width="432" height="400" rx="20" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="72" y="104" font-size="24" font-weight="700" fill="#263238">The business case</text>
  <text x="72" y="128" font-size="14" fill="#78909C">Features shipped per sprint</text>

  <!-- chart -->
  <path d="M88 300H440" stroke="#CFD8DC" stroke-width="2"/>
  <g fill="#90A4AE">
    <rect x="100" y="256" width="28" height="44" rx="4"/>
    <rect x="140" y="262" width="28" height="38" rx="4"/>
    <rect x="180" y="266" width="28" height="34" rx="4"/>
  </g>
  <g fill="#3F51B5">
    <rect x="276" y="236" width="28" height="64" rx="4"/>
    <rect x="316" y="212" width="28" height="88" rx="4"/>
    <rect x="356" y="184" width="28" height="116" rx="4"/>
    <rect x="396" y="160" width="28" height="140" rx="4"/>
  </g>
  <path d="M240 160V300" stroke="#FFC107" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="200" y="146" width="80" height="24" rx="12" fill="#FFC107"/>
  <text x="240" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">Redesign</text>
  <g font-size="12" font-weight="700" fill="#90A4AE" text-anchor="middle">
    <text x="154" y="320">Before</text><text x="350" y="320">After</text>
  </g>

  <!-- pitch chips -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="72" y="344" width="176" height="36" rx="18" fill="#E8EAF6"/>
    <text x="160" y="367" fill="#3F51B5">Faster features</text>
    <rect x="264" y="344" width="176" height="36" rx="18" fill="#E0F2F1"/>
    <text x="352" y="367" fill="#00796B">Less code</text>
    <rect x="72" y="392" width="176" height="36" rx="18" fill="#E8F5E9"/>
    <text x="160" y="415" fill="#2E7D32">Better support</text>
    <rect x="264" y="392" width="176" height="36" rx="18" fill="#FFF8E1"/>
    <text x="352" y="415" fill="#8D6E00">Features that work</text>
  </g>
</svg>
