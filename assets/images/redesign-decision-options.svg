<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="40" y="56" width="432" height="400" rx="20" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="72" y="104" font-size="24" font-weight="700" fill="#263238">Three options</text>
  <text x="72" y="128" font-size="14" fill="#78909C">Each one costs more than the last</text>

  <!-- Refactor -->
  <rect x="72" y="152" width="368" height="76" rx="14" fill="#E0F2F1"/>
  <circle cx="108" cy="190" r="20" fill="#009688"/>
  <path d="M117 184A10 10 0 1 0 118 194" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M111 182l7 2l-1 -7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="184" font-size="17" font-weight="700" fill="#263238">Refactor</text>
  <text x="142" y="206" font-size="13" fill="#546E7A">Clean up inside the pull request</text>
  <rect x="352" y="176" width="72" height="28" rx="14" fill="#009688"/>
  <text x="388" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">10 min</text>

  <!-- Redesign -->
  <rect x="72" y="244" width="368" height="76" rx="14" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
  <circle cx="108" cy="282" r="20" fill="#3F51B5"/>
  <rect x="98" y="272" width="8" height="8" fill="#FFFFFF"/><rect x="110" y="272" width="8" height="8" fill="#FFFFFF"/>
  <rect x="98" y="284" width="8" height="8" fill="#FFFFFF"/><rect x="110" y="284" width="8" height="8" fill="#FFC107"/>
  <text x="142" y="276" font-size="17" font-weight="700" fill="#263238">Redesign</text>
  <text x="142" y="298" font-size="13" fill="#546E7A">Pay down years of tech debt</text>
  <rect x="352" y="268" width="72" height="28" rx="14" fill="#3F51B5"/>
  <text x="388" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Weeks</text>

  <!-- Rewrite -->
  <rect x="72" y="336" width="368" height="76" rx="14" fill="#FFEBEE"/>
  <circle cx="108" cy="374" r="20" fill="#E53935"/>
  <path d="M100 366l16 16M116 366l-16 16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="142" y="368" font-size="17" font-weight="700" fill="#263238">Rewrite</text>
  <text x="142" y="390" font-size="13" fill="#546E7A">Start a new repo from scratch</text>
  <rect x="352" y="360" width="72" height="28" rx="14" fill="#E53935"/>
  <text x="388" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Years</text>
</svg>
