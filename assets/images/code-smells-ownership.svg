<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263238" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="166" y="36" width="180" height="36" rx="18" fill="#FFC107" filter="url(#e2)"/>
  <text x="256" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Deliberate practice</text>

  <!-- Stand -->
  <rect x="250" y="150" width="12" height="282" fill="#546E7A"/>
  <rect x="176" y="430" width="160" height="16" rx="8" fill="#37474F"/>

  <!-- Beam tips toward habits -->
  <rect x="106" y="146" width="300" height="8" rx="4" fill="#37474F" transform="rotate(-10 256 150)"/>
  <circle cx="256" cy="150" r="12" fill="#3F51B5"/>

  <!-- Nature pan (heavier) -->
  <path d="M108 176L68 290M108 176L148 290" stroke="#78909C" stroke-width="2"/>
  <path d="M58 290H158a50 22 0 0 1 -100 0Z" fill="#3F51B5"/>
  <rect x="58" y="242" width="100" height="48" rx="8" fill="#E8EAF6" filter="url(#e2)"/>
  <text x="108" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#3F51B5">Habits</text>
  <text x="108" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#3F51B5">Nature</text>

  <!-- Nurture pan (lighter) -->
  <path d="M404 124L364 238M404 124L444 238" stroke="#78909C" stroke-width="2"/>
  <path d="M354 238H454a50 22 0 0 1 -100 0Z" fill="#90A4AE"/>
  <rect x="354" y="190" width="100" height="48" rx="8" fill="#FFFFFF" filter="url(#e2)"/>
  <text x="404" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#607D8B">Environment</text>
  <text x="404" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#78909C">Nurture</text>

  <text x="256" y="488" text-anchor="middle" font-size="22" font-weight="700" fill="#263238">Own your habits</text>
</svg>
