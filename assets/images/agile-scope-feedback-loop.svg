<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263238" flood-opacity="0.25"/>
    </filter>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7986CB"/>
    </marker>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- Iteration loop: Plan -> Build -> Demo -> Learn -->
  <g fill="none" stroke="#7986CB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M295.5 70.2A190 190 0 0 1 441.8 216.5"/>
    <path d="M441.8 295.5A190 190 0 0 1 295.5 441.8"/>
    <path d="M216.5 441.8A190 190 0 0 1 70.2 295.5"/>
    <path d="M70.2 216.5A190 190 0 0 1 216.5 70.2"/>
  </g>
  <g filter="url(#e2)">
    <circle cx="256" cy="66" r="34" fill="#3F51B5"/>
    <circle cx="446" cy="256" r="34" fill="#009688"/>
    <circle cx="256" cy="446" r="34" fill="#FFC107"/>
    <circle cx="66" cy="256" r="34" fill="#43A047"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="256" y="71" fill="#FFFFFF">Plan</text>
    <text x="446" y="261" fill="#FFFFFF">Build</text>
    <text x="256" y="451" fill="#263238">Demo</text>
    <text x="66" y="261" fill="#FFFFFF">Learn</text>
  </g>

  <!-- Backlog, re-prioritised every loop -->
  <rect x="151" y="166" width="210" height="180" rx="16" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="171" y="196" font-size="16" font-weight="700" fill="#263238">Backlog</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="171" y="212" width="62" height="22" rx="11" fill="#E8EAF6"/>
    <text x="202" y="227" fill="#3F51B5">Must</text>
    <rect x="243" y="219" width="98" height="8" rx="4" fill="#9FA8DA"/>
    <rect x="171" y="244" width="62" height="22" rx="11" fill="#E0F2F1"/>
    <text x="202" y="259" fill="#00796B">Should</text>
    <rect x="243" y="251" width="76" height="8" rx="4" fill="#80CBC4"/>
    <rect x="171" y="276" width="62" height="22" rx="11" fill="#FFF8E1"/>
    <text x="202" y="291" fill="#E65100">Could</text>
    <rect x="243" y="283" width="56" height="8" rx="4" fill="#FFE082"/>
    <rect x="171" y="308" width="62" height="22" rx="11" fill="#ECEFF1"/>
    <text x="202" y="323" fill="#607D8B">Won't</text>
    <rect x="243" y="315" width="40" height="8" rx="4" fill="#CFD8DC"/>
  </g>
</svg>
