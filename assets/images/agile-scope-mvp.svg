<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e8" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#263238" flood-opacity="0.25"/>
    </filter>
    <!-- A feature left out of the MVP: flat, faded, struck through -->
    <g id="cut">
      <rect width="140" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.55" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="6 4"/>
      <line x1="22" y1="28" x2="118" y2="28" stroke="#90A4AE" stroke-width="2"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <text x="256" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">The smallest behaviour that solves the need</text>

  <g font-size="15" fill="#90A4AE" text-anchor="middle">
    <use href="#cut" x="40" y="92"/><text x="110" y="125">Dark mode</text>
    <use href="#cut" x="332" y="92"/><text x="402" y="125">PDF export</text>
    <use href="#cut" x="40" y="380"/><text x="110" y="413">Social login</text>
    <use href="#cut" x="332" y="380"/><text x="402" y="413">Custom themes</text>
    <use href="#cut" x="186" y="440"/><text x="256" y="473">Animations</text>
  </g>

  <!-- The one feature the customer came for -->
  <rect x="106" y="180" width="300" height="170" rx="20" fill="#3F51B5" filter="url(#e8)"/>
  <circle cx="156" cy="232" r="26" fill="#5C6BC0"/>
  <text x="156" y="242" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">$</text>
  <text x="196" y="230" font-size="20" font-weight="700" fill="#FFFFFF">Calculate revenue</text>
  <text x="196" y="252" font-size="14" fill="#C5CAE9">Core behaviour</text>
  <rect x="136" y="288" width="240" height="8" rx="4" fill="#7986CB"/>
  <rect x="136" y="306" width="180" height="8" rx="4" fill="#7986CB"/>
  <rect x="340" y="168" width="50" height="24" rx="12" fill="#FFC107"/>
  <text x="365" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#263238">MVP</text>
</svg>
