<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="56" y="76" width="400" height="360" rx="20" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="88" y="124" font-size="24" font-weight="700" fill="#263238">Feedback timing</text>
  <text x="88" y="148" font-size="14" fill="#78909C">Check the work early, not at the last moment</text>

  <!-- Solo lane -->
  <text x="88" y="190" font-size="14" font-weight="700" fill="#546E7A">Solo, two weeks alone</text>
  <rect x="88" y="202" width="270" height="14" rx="7" fill="#CFD8DC"/>
  <circle cx="392" cy="209" r="18" fill="#E53935"/>
  <path d="M385 202l14 14M399 202l-14 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="244" font-size="13" fill="#E53935">Late pull request: the team scraps it</text>

  <!-- Pair lane -->
  <text x="88" y="292" font-size="14" font-weight="700" fill="#546E7A">Pairing, every day</text>
  <rect x="88" y="304" width="270" height="14" rx="7" fill="#B2DFDB"/>
  <g fill="#009688">
    <circle cx="112" cy="311" r="6"/><circle cx="160" cy="311" r="6"/><circle cx="208" cy="311" r="6"/>
    <circle cx="256" cy="311" r="6"/><circle cx="304" cy="311" r="6"/><circle cx="346" cy="311" r="6"/>
  </g>
  <circle cx="392" cy="311" r="18" fill="#43A047"/>
  <path d="M384 311l5 5 10 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="346" font-size="13" fill="#009688">Continual feedback at each step</text>

  <rect x="88" y="384" width="180" height="32" rx="16" fill="#FFC107"/>
  <text x="178" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Few cursory issues</text>
</svg>
