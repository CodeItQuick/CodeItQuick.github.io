<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
    <g id="done">
      <circle r="14" fill="currentColor"/>
      <path d="M-6 0l4 4 8 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle id="miss" r="13" fill="none" stroke="#CFD8DC" stroke-width="2"/>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="56" y="76" width="400" height="360" rx="20" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="88" y="124" font-size="24" font-weight="700" fill="#263238">Good habits</text>
  <text x="88" y="148" font-size="14" fill="#78909C">Compile, test, and lint every day</text>

  <g font-size="13" font-weight="700" fill="#90A4AE" text-anchor="middle">
    <text x="250" y="186">M</text><text x="290" y="186">T</text><text x="330" y="186">W</text>
    <text x="370" y="186">T</text><text x="410" y="186">F</text>
  </g>

  <!-- Compile -->
  <circle cx="104" cy="220" r="18" fill="#E8EAF6"/>
  <text x="104" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#3F51B5">&lt;/&gt;</text>
  <text x="132" y="226" font-size="16" font-weight="700" fill="#263238">Compile</text>
  <g color="#3F51B5">
    <use href="#done" x="250" y="220"/><use href="#done" x="290" y="220"/><use href="#done" x="330" y="220"/>
    <use href="#done" x="370" y="220"/><use href="#done" x="410" y="220"/>
  </g>

  <!-- Test -->
  <circle cx="104" cy="280" r="18" fill="#E8F5E9"/>
  <path d="M96 280l5 5 10 -10" fill="none" stroke="#43A047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="286" font-size="16" font-weight="700" fill="#263238">Test</text>
  <g color="#43A047">
    <use href="#done" x="250" y="280"/><use href="#done" x="290" y="280"/>
    <use href="#done" x="370" y="280"/><use href="#done" x="410" y="280"/>
  </g>
  <use href="#miss" x="330" y="280"/>

  <!-- Lint -->
  <circle cx="104" cy="340" r="18" fill="#E0F2F1"/>
  <path d="M95 334h18M95 340h12M95 346h16" stroke="#009688" stroke-width="3" stroke-linecap="round"/>
  <text x="132" y="346" font-size="16" font-weight="700" fill="#263238">Lint</text>
  <g color="#009688">
    <use href="#done" x="250" y="340"/><use href="#done" x="290" y="340"/><use href="#done" x="330" y="340"/>
    <use href="#done" x="370" y="340"/><use href="#done" x="410" y="340"/>
  </g>

  <rect x="88" y="384" width="150" height="32" rx="16" fill="#FFC107"/>
  <text x="163" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">14-day streak</text>
</svg>
