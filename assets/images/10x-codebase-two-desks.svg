<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263238" flood-opacity="0.25"/>
    </filter>
    <!-- One developer at one desk; reused on both sides so only the codebase differs -->
    <g id="desk">
      <rect x="48" y="270" width="160" height="10" rx="3" fill="#37474F"/>
      <rect x="60" y="280" width="8" height="60" fill="#455A64"/>
      <rect x="188" y="280" width="8" height="60" fill="#455A64"/>
      <rect x="110" y="262" width="70" height="8" rx="2" fill="#90A4AE"/>
      <rect x="120" y="220" width="52" height="42" rx="4" fill="#546E7A"/>
      <rect x="124" y="224" width="44" height="34" rx="2" fill="#263238"/>
      <rect x="128" y="230" width="22" height="3" rx="1.5" fill="#80CBC4"/>
      <rect x="132" y="237" width="28" height="3" rx="1.5" fill="#9FA8DA"/>
      <rect x="132" y="244" width="18" height="3" rx="1.5" fill="#FFE082"/>
      <rect x="128" y="251" width="12" height="3" rx="1.5" fill="#80CBC4"/>
      <rect x="48" y="238" width="8" height="70" rx="3" fill="#78909C"/>
      <rect x="50" y="300" width="42" height="8" rx="3" fill="#78909C"/>
      <rect x="67" y="308" width="6" height="32" fill="#78909C"/>
      <rect x="80" y="282" width="44" height="13" rx="6.5" fill="#37474F"/>
      <rect x="112" y="282" width="12" height="54" rx="6" fill="#37474F"/>
      <rect x="62" y="226" width="36" height="66" rx="16" fill="var(--shirt)"/>
      <rect x="86" y="246" width="40" height="10" rx="5" fill="var(--shirt)"/>
      <circle cx="82" cy="204" r="16" fill="#FFCC80"/>
      <path d="M66 202a16 16 0 0 1 32 -4c-8 -6 -22 -6 -32 4z" fill="#4E342E"/>
    </g>
  </defs>

  <!-- Left: 10x codebase -->
  <rect x="0" y="0" width="256" height="512" fill="#E8EAF6"/>
  <!-- Code cards flow into the laptop and ship -->
  <g filter="url(#lift)">
    <rect x="20" y="96" width="44" height="30" rx="5" fill="#FFFFFF"/>
    <rect x="80" y="96" width="44" height="30" rx="5" fill="#FFFFFF"/>
    <rect x="140" y="96" width="44" height="30" rx="5" fill="#FFFFFF"/>
  </g>
  <g fill="#7986CB">
    <rect x="27" y="104" width="24" height="4" rx="2"/><rect x="27" y="113" width="30" height="4" rx="2"/>
    <rect x="87" y="104" width="30" height="4" rx="2"/><rect x="87" y="113" width="20" height="4" rx="2"/>
    <rect x="147" y="104" width="22" height="4" rx="2"/><rect x="147" y="113" width="30" height="4" rx="2"/>
  </g>
  <g stroke="#9FA8DA" stroke-width="3" stroke-linecap="round">
    <line x1="8" y1="104" x2="14" y2="104"/><line x1="4" y1="114" x2="14" y2="114"/>
    <line x1="68" y1="111" x2="76" y2="111"/><line x1="128" y1="111" x2="136" y2="111"/>
    <line x1="188" y1="111" x2="196" y2="111"/>
  </g>
  <circle cx="220" cy="111" r="18" fill="#43A047" filter="url(#lift)"/>
  <path d="M211 111l6 6 12 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smooth conveyor under the desk -->
  <rect x="16" y="342" width="224" height="24" rx="12" fill="#3F51B5"/>
  <g fill="#C5CAE9">
    <circle cx="32" cy="354" r="6"/><circle cx="60" cy="354" r="6"/><circle cx="88" cy="354" r="6"/>
    <circle cx="116" cy="354" r="6"/><circle cx="144" cy="354" r="6"/><circle cx="172" cy="354" r="6"/>
    <circle cx="200" cy="354" r="6"/><circle cx="228" cy="354" r="6"/>
  </g>
  <g fill="none" stroke="#7986CB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 384l10 8 -10 8"/><path d="M116 384l10 8 -10 8"/><path d="M148 384l10 8 -10 8"/>
  </g>
  <use href="#desk" style="--shirt:#3F51B5"/>
  <text x="128" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#283593">10x codebase</text>
  <text x="128" y="478" text-anchor="middle" font-size="13" fill="#5C6BC0">Changes ship in one place</text>

  <!-- Right: 0.1x codebase -->
  <rect x="256" y="0" width="256" height="512" fill="#FBE9E7"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="272" y="340" width="224" height="4" rx="2" fill="#BCAAA4"/>
  <g transform="translate(256 0)">
    <use href="#desk" style="--shirt:#8D6E63"/>
  </g>
  <!-- Code cards stuck in a tangle of wires -->
  <g filter="url(#lift)">
    <rect x="282" y="92" width="44" height="30" rx="5" fill="#FFFFFF" transform="rotate(-14 304 107)"/>
    <rect x="352" y="120" width="44" height="30" rx="5" fill="#FFFFFF" transform="rotate(10 374 135)"/>
    <rect x="420" y="84" width="44" height="30" rx="5" fill="#FFFFFF" transform="rotate(-6 442 99)"/>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M262 150c40 -80 60 60 100 -10s50 70 90 -20 40 60 56 20" stroke="#8D6E63"/>
    <path d="M266 200c30 40 70 -60 110 0s40 -50 80 10 30 -30 50 0" stroke="#BF360C"/>
    <path d="M276 330c20 -60 50 40 40 -40s60 30 80 -40 50 60 70 -10" stroke="#A1887F"/>
    <path d="M300 344c-10 -40 30 -60 20 -100M460 344c20 -50 -30 -70 10 -120" stroke="#6D4C41"/>
    <path d="M290 400c40 -30 80 30 120 -10s50 20 80 -5" stroke="#D84315"/>
  </g>
  <circle cx="476" cy="40" r="18" fill="#E53935" filter="url(#lift)"/>
  <rect x="473.5" y="28" width="5" height="15" rx="2.5" fill="#FFFFFF"/>
  <circle cx="476" cy="50" r="3" fill="#FFFFFF"/>
  <text x="384" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#BF360C">0.1x codebase</text>
  <text x="384" y="478" text-anchor="middle" font-size="13" fill="#8D6E63">One change touches four places</text>
</svg>
