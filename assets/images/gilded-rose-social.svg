<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e8" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
    <clipPath id="card"><rect x="150" y="115" width="900" height="400" rx="28"/></clipPath>
  </defs>
  <!-- Source for gilded-rose-social.png; re-render at 1200x630 after edits -->
  <rect width="1200" height="630" fill="#ECEFF1"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="150" y="115" width="900" height="400" rx="28" fill="#FFFFFF" filter="url(#e8)"/>
  <rect x="150" y="115" width="14" height="400" fill="#3F51B5" clip-path="url(#card)"/>
  <text x="220" y="250" font-size="92" font-weight="800" fill="#263238">Gilded Rose</text>
  <text x="222" y="320" font-size="34" fill="#546E7A">A refactoring kata for messy legacy code</text>
  <g font-size="24" font-weight="700" text-anchor="middle">
    <rect x="222" y="372" width="150" height="48" rx="24" fill="#43A047"/>
    <text x="297" y="404" fill="#FFFFFF">140 tests</text>
    <rect x="388" y="372" width="170" height="48" rx="24" fill="#E8F5E9"/>
    <text x="473" y="404" fill="#2E7D32">100% lines</text>
    <rect x="574" y="372" width="150" height="48" rx="24" fill="#E8EAF6"/>
    <text x="649" y="404" fill="#3F51B5">Refactor</text>
    <rect x="740" y="372" width="205" height="48" rx="24" fill="#FFEBEE"/>
    <text x="842.5" y="404" fill="#C62828">Add Conjured</text>
  </g>
  <text x="980" y="482" text-anchor="end" font-size="22" font-weight="600" fill="#90A4AE">CodeItQuick</text>
</svg>
