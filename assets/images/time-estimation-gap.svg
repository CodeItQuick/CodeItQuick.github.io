<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect x="56" y="76" width="400" height="360" rx="20" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="88" y="124" font-size="24" font-weight="700" fill="#263238">The estimation gap</text>
  <text x="88" y="148" font-size="14" fill="#78909C">Promise and delivery drift apart</text>

  <g font-size="12" font-weight="700" fill="#90A4AE" text-anchor="middle">
    <text x="191" y="186">W1</text><text x="222" y="186">W2</text><text x="253" y="186">W3</text><text x="284" y="186">W4</text>
    <text x="315" y="186">W5</text><text x="346" y="186">W6</text><text x="377" y="186">W7</text><text x="408" y="186">W8</text>
  </g>

  <text x="88" y="229" font-size="15" font-weight="700" fill="#263238">Promise</text>
  <rect x="176" y="210" width="124" height="28" rx="8" fill="#3F51B5"/>

  <text x="88" y="279" font-size="15" font-weight="700" fill="#263238">Delivery</text>
  <rect x="176" y="260" width="217" height="28" rx="8" fill="#E53935"/>
  <rect x="176" y="260" width="124" height="28" rx="8" fill="#009688"/>
  <rect x="290" y="260" width="10" height="28" fill="#009688"/>

  <line x1="300" y1="196" x2="300" y2="304" stroke="#263238" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="292" y="318" text-anchor="end" font-size="12" font-weight="700" fill="#546E7A">Deadline</text>
  <path d="M300 318v8h93v-8" fill="none" stroke="#E53935" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="346.5" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#E53935">3-week gap</text>

  <rect x="88" y="384" width="130" height="32" rx="16" fill="#FFC107"/>
  <text x="153" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Hard mode</text>
</svg>
