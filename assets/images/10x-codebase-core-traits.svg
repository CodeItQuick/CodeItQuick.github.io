<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <!-- Material elevations 1, 2, 4, 8 -->
    <filter id="e1" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#263238" flood-opacity="0.25"/></filter>
    <filter id="e2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263238" flood-opacity="0.22"/></filter>
    <filter id="e3" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#263238" flood-opacity="0.2"/></filter>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#263238" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- Readable -->
  <g transform="translate(36 52)">
    <rect width="200" height="184" rx="16" fill="#FFFFFF" filter="url(#e1)"/>
    <circle cx="44" cy="48" r="24" fill="#E8EAF6"/>
    <text x="44" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#3F51B5">Aa</text>
    <text x="24" y="112" font-size="22" font-weight="700" fill="#263238">Readable</text>
    <rect x="24" y="130" width="130" height="6" rx="3" fill="#C5CAE9"/>
    <rect x="24" y="146" width="96" height="6" rx="3" fill="#C5CAE9"/>
  </g>

  <!-- Simple -->
  <g transform="translate(276 52)">
    <rect width="200" height="184" rx="16" fill="#FFFFFF" filter="url(#e2)"/>
    <circle cx="44" cy="48" r="24" fill="#E0F2F1"/>
    <line x1="30" y1="48" x2="58" y2="48" stroke="#009688" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="112" font-size="22" font-weight="700" fill="#263238">Simple</text>
    <rect x="24" y="130" width="70" height="6" rx="3" fill="#B2DFDB"/>
  </g>

  <!-- Tested -->
  <g transform="translate(36 276)">
    <rect width="200" height="184" rx="16" fill="#FFFFFF" filter="url(#e3)"/>
    <circle cx="44" cy="48" r="24" fill="#E8F5E9"/>
    <path d="M33 48l8 8 15 -16" fill="none" stroke="#43A047" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="112" font-size="22" font-weight="700" fill="#263238">Tested</text>
    <g fill="#A5D6A7">
      <circle cx="30" cy="140" r="6"/><circle cx="50" cy="140" r="6"/><circle cx="70" cy="140" r="6"/>
      <circle cx="90" cy="140" r="6"/><circle cx="110" cy="140" r="6"/>
    </g>
  </g>

  <!-- Delivered -->
  <g transform="translate(276 268)">
    <rect width="200" height="184" rx="16" fill="#3F51B5" filter="url(#e4)"/>
    <circle cx="44" cy="48" r="24" fill="#5C6BC0"/>
    <path d="M44 60V36M33 47l11 -11 11 11" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="112" font-size="22" font-weight="700" fill="#FFFFFF">Delivered</text>
    <rect x="24" y="130" width="110" height="6" rx="3" fill="#7986CB"/>
    <rect x="24" y="146" width="140" height="6" rx="3" fill="#7986CB"/>
  </g>
</svg>
