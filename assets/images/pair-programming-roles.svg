<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#90A4AE"/>
    </marker>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="56" y="76" width="400" height="360" rx="20" fill="#FFFFFF" filter="url(#e4)"/>
  <text x="88" y="124" font-size="24" font-weight="700" fill="#263238">Driver and navigator</text>
  <text x="88" y="148" font-size="14" fill="#78909C">Two roles, one keyboard, frequent swaps</text>

  <!-- Navigator -->
  <circle cx="136" cy="190" r="17" fill="#3F51B5"/>
  <path d="M106 240a30 30 0 0 1 60 0z" fill="#3F51B5"/>
  <text x="136" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Navigator</text>
  <text x="136" y="284" text-anchor="middle" font-size="13" fill="#78909C">Gives directions</text>

  <!-- Laptop -->
  <rect x="220" y="182" width="72" height="48" rx="4" fill="#263238"/>
  <path d="M228 194h30M228 204h44M228 214h22" stroke="#80CBC4" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 230h92l-6 10h-80z" fill="#90A4AE"/>
  <path d="M232 260h46" stroke="#90A4AE" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M280 272h-46" stroke="#90A4AE" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Driver -->
  <circle cx="376" cy="190" r="17" fill="#009688"/>
  <path d="M346 240a30 30 0 0 1 60 0z" fill="#009688"/>
  <text x="376" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Driver</text>
  <text x="376" y="284" text-anchor="middle" font-size="13" fill="#78909C">Types the code</text>

  <!-- Timer -->
  <circle cx="116" cy="336" r="24" fill="none" stroke="#ECEFF1" stroke-width="6"/>
  <circle cx="116" cy="336" r="24" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="113 151" transform="rotate(-90 116 336)"/>
  <text x="116" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">15:00</text>
  <text x="156" y="332" font-size="16" font-weight="700" fill="#263238">15-minute turns</text>
  <text x="156" y="352" font-size="13" fill="#78909C">One to three hours of pairing a day</text>

  <!-- Git hand-off -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="88" y="386" width="72" height="28" rx="14" fill="#E8EAF6"/><text x="124" y="405" fill="#3F51B5">commit</text>
    <rect x="176" y="386" width="72" height="28" rx="14" fill="#E8EAF6"/><text x="212" y="405" fill="#3F51B5">push</text>
    <rect x="264" y="386" width="72" height="28" rx="14" fill="#FFC107"/><text x="300" y="405" fill="#263238">swap</text>
    <rect x="352" y="386" width="72" height="28" rx="14" fill="#E0F2F1"/><text x="388" y="405" fill="#009688">pull</text>
  </g>
  <g fill="#90A4AE"><path d="M171 400l-8 -4v8z"/><path d="M259 400l-8 -4v8z"/><path d="M347 400l-8 -4v8z"/></g>
</svg>
