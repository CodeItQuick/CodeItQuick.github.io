  <text x="99" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#3F51B5">Planned: bridge</text>
  <path d="M190 44H318M308 36l10 8 -10 8" fill="none" stroke="#78909C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="338" y="24" width="150" height="40" rx="20" fill="#43A047" filter="url(#lift)"/>
  <text x="413" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Shipped: ferry</text>
  <text x="256" y="470" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">We planned a bridge. We built a ferry.</text>
