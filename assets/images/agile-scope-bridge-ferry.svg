    <rect x="246" y="300" width="20" height="14" rx="3"/>
    <rect x="276" y="300" width="20" height="14" rx="3"/>
  </g>
  <line x1="256" y1="284" x2="256" y2="256" stroke="#37474F" stroke-width="3"/>
  <path d="M257 256l22 7 -22 7z" fill="#EF5350"/>
  <g fill="none" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round">
    <path d="M150 376q12 -8 24 0t24 0"/>
