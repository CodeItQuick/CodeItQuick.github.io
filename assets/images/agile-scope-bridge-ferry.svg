    <path d="M176 330H336L320 362H192Z" fill="#3F51B5"/>
    <rect x="206" y="290" width="100" height="40" rx="6" fill="#FFFFFF"/>
  </g>
  <rect x="176" y="326" width="160" height="6" fill="#283593"/>
  <rect x="200" y="284" width="112" height="8" rx="4" fill="#FFC107"/>
