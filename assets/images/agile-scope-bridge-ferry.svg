      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#E3F2FD"/>
  <rect y="290" width="512" height="222" fill="#64B5F6"/>
  <rect y="410" width="512" height="102" fill="#42A5F5"/>

  <!-- Banks -->
