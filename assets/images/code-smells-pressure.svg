  <path d="M232 440q30 20 60 -6" fill="none" stroke="#F9A825" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <text x="132" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#F57F17">Shifting requirements</text>
