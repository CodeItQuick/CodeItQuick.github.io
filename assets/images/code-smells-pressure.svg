<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" font-family="Inter, Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    </pattern>
    <filter id="e2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263238" flood-opacity="0.25"/>
    </filter>
    <filter id="e4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263238" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#ECEFF1"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <text x="256" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#263238">The environment around the code</text>

  <!-- A god class: long lines spill past the card -->
  <rect x="146" y="110" width="220" height="250" rx="16" fill="#FFFFFF" filter="url(#e4)"/>
  <rect x="146" y="110" width="220" height="40" rx="16" fill="#ECEFF1"/>
  <rect x="146" y="134" width="220" height="16" fill="#ECEFF1"/>
  <circle cx="166" cy="130" r="5" fill="#EF5350"/><circle cx="182" cy="130" r="5" fill="#FFC107"/><circle cx="198" cy="130" r="5" fill="#66BB6A"/>
  <text x="214" y="135" font-size="12" font-weight="700" fill="#546E7A">OrderManager.java</text>
  <g fill="#B0BEC5">
    <rect x="166" y="166" width="120" height="6" rx="3"/>
    <rect x="178" y="180" width="150" height="6" rx="3"/>
    <rect x="190" y="194" width="110" height="6" rx="3"/>
    <rect x="202" y="236" width="90" height="6" rx="3"/>
    <rect x="214" y="250" width="130" height="6" rx="3"/>
    <rect x="202" y="292" width="100" height="6" rx="3"/>
    <rect x="178" y="320" width="140" height="6" rx="3"/>
  </g>
  <g fill="#EF9A9A">
    <rect x="202" y="208" width="210" height="6" rx="3"/>
    <rect x="214" y="222" width="240" height="6" rx="3"/>
    <rect x="226" y="264" width="200" height="6" rx="3"/>
    <rect x="238" y="278" width="230" height="6" rx="3"/>
    <rect x="190" y="306" width="220" height="6" rx="3"/>
  </g>
  <rect x="166" y="336" width="86" height="16" rx="8" fill="#FFEBEE"/>
  <text x="209" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#C62828">2,400 lines</text>

  <!-- Tight deadlines -->
  <circle cx="70" cy="210" r="36" fill="#FF7043" filter="url(#e2)"/>
  <circle cx="70" cy="210" r="22" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M70 196V210L80 216" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M114 200l10 10 -10 10M128 200l10 10 -10 10" fill="none" stroke="#FF7043" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#D84315">Tight deadlines</text>

  <!-- Working alone -->
  <circle cx="442" cy="400" r="36" fill="#8D6E63" filter="url(#e2)"/>
  <path d="M426 388h32a6 6 0 0 1 6 6v14a6 6 0 0 1 -6 6h-20l-10 8v-8h-2a6 6 0 0 1 -6 -6v-14a6 6 0 0 1 6 -6z" fill="#FFFFFF"/>
  <path d="M424 418L460 382" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <text x="442" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#6D4C41">Working alone</text>

  <!-- Shifting requirements -->
  <g filter="url(#e2)">
    <rect x="40" y="380" width="56" height="44" rx="4" fill="#FFE082" transform="rotate(-10 68 402)"/>
    <rect x="104" y="392" width="56" height="44" rx="4" fill="#FFD54F" transform="rotate(8 132 414)"/>
    <rect x="168" y="384" width="56" height="44" rx="4" fill="#FFE082" transform="rotate(-4 196 406)"/>
