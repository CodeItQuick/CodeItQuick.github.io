<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" x-init="mode = 'dark'" x-data="
{
    mode: 'light',
    darkModeOn() {
        this.mode = 'dark';
        localStorage.setItem('siteTheme', 'dark');
     },
    lightModeOn() {
        this.mode = 'light';
        localStorage.setItem('siteTheme', 'light');
    },
    getMode() {
        if (localStorage.getItem('siteTheme')) {
            this.mode = localStorage.getItem('siteTheme');
        }
        return this.mode;
    }
}">
{% include header.html
    tags=page.tags
    description=page.description
    name=page.name
    permalink=page.url
    image=page.image
%}

<body class="bg-backgroundPrimary antialiased font-[body] min-h-svh flex flex-col"
      x-bind:data-theme="getMode()">

    <nav class="max-w-3xl mx-auto w-full">
        {% include navbar.html %}
    </nav>

    <main class="grow max-w-3xl mx-auto w-full">
        <div class="md:max-w-4xl py-8 mx-auto">
            <div class="w-full markdown text-wrap p-4">
                {{ content }}
            </div>
        </div>

    </main>

    <footer class="site-footer footer footer-center m-0 p-4 bg-base-300 text-base-content mt-auto">
        <aside>
            <p>Copyright © {{ site.time | date: '%Y' }} - All rights reserved by CodeItQuick</p>
        </aside>
    </footer>

</body>

</html>
