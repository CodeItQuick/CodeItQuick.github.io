<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" x-init="mode = 'dark'" x-data="
{
    mode: 'light',
    darkModeOn() {
        this.mode = 'dark';
        localStorage.setItem('siteTheme', 'dark');
     },
    lightModeOn() {
        this.mode = 'light';
        localStorage.setItem('siteTheme', 'light');
    },
    getMode() {
        if (localStorage.getItem('siteTheme')) {
            this.mode = localStorage.getItem('siteTheme');
        }
        return this.mode;
    }
}" >
  {% include header.html %}
  <nav class="grow max-w-3xl mx-auto w-full">
    {% include navbar.html %}
  </nav>
  <body class="mx-auto antialiased font-[body] min-h-svh flex flex-col"  x-bind:data-theme="getMode()">


  <div class="grow max-w-3xl mx-auto w-full">
    {% include hero.html title=site.title description=site.description image="hero_project_graveyard.webp" %}
  </div>

  </body>
  <footer class="footer footer-center m-0 p-4 bg-backgroundSecondary text-base-content mt-auto">
    <aside>
      <p>Copyright © 2024 - All right reserved by CodeItQuick</p>
    </aside>
  </footer>
</html>
