<!DOCTYPE html>
<html x-bind:data-theme="getMode()" lang="{{ site.lang | default: 'en-US' }}" x-data="
{
    mode: 'dark',
    darkModeOn() {
        this.mode = 'dark';
        localStorage.setItem('siteTheme', 'dark');
     },
    lightModeOn() {
        this.mode = 'light';
        localStorage.setItem('siteTheme', 'light');
    },
    getMode() {
        if (localStorage.getItem('siteTheme')) {
            this.mode = localStorage.getItem('siteTheme');
        }
        return this.mode;
    }
}" >
  {% include header.html %}
  <body class="bg-backgroundPrimary antialiased font-[body] min-h-svh flex flex-col">
  <nav class="max-w-3xl mx-auto w-full">
    {% include navbar.html %}
  </nav>


  <div class="grow max-w-3xl mx-auto w-full">
    {% include hero.html title=site.title description=site.description image="hero_project_graveyard.webp" %}
  </div>

  <footer class="site-footer footer footer-center m-0 p-4 bg-backgroundSecondary text-base-content mt-auto">
    <aside>
      <p>Copyright © {{ site.time | date: '%Y' }} - All rights reserved by CodeItQuick</p>
    </aside>
  </footer>
  </body>
</html>
