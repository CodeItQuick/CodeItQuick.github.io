---
layout: dojo
---

<html x-bind:data-theme="getMode()" lang="{{ site.lang | default: 'en-US' }}" x-data="
{
    mode: 'dark',
    darkModeOn() {
        this.mode = 'dark';
        localStorage.setItem('siteTheme', 'dark');
     },
    lightModeOn() {
        this.mode = 'light';
        localStorage.setItem('siteTheme', 'light');
    },
    getMode() {
        if (localStorage.getItem('siteTheme')) {
            this.mode = localStorage.getItem('siteTheme');
        }
        return this.mode;
    }
}">
{% include header.html %}

<body class="bg-neutral text-neutral-content min-w-fit md:max-w-full antialiased font-[body] min-h-svh flex flex-col">
<nav>
    {% include navbar.html %}
</nav>
<main class="grow">

<div class="bg-neutral w-full">
    <div class="md:max-w-4xl py-8 mx-auto">
        <div class="w-full markdown text-neutral-content text-wrap">
            {{ content }}
        </div>
    </div>
</div>


</main>
<footer class="footer footer-center m-0 p-4 bg-base-300 text-base-content mt-auto">
    <aside>
        <p>Copyright © 2024 - All right reserved by CodeItQuick</p>
    </aside>
</footer>
</body>
</html>
